name: Build and Deploy Jekyll (dual)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # ==========================================================
      # Build 1 — GitHub Pages (baseurl padrão)
      # ==========================================================
      - name: Build Jekyll (gh-pages)
        run: |
          bundle exec jekyll build --baseurl "/site-labmap" --destination _site_gh_pages

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site_gh_pages